[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadbean"
version = "0.1.0"
description = "Say it in the car, get it in the ledger: voice memos to Beancount mileage and receipt entries, using local open-weight models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # core (process, doctor) is pure standard library, so it installs on Termux as-is

[project.optional-dependencies]
ledger = ["beancount>=3.0"]        # needed only for `roadbean logbook`; builds from source on Android
dev = ["beancount>=3.0", "pytest"]

[project.scripts]
roadbean = "roadbean.cli:main"

[tool.setuptools]
packages = ["roadbean", "roadbean.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
